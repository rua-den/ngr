name: Phase 2 Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Ngr.Launcher.sln

      - name: Debug tests
        run: dotnet test Ngr.Launcher.sln -c Debug --no-restore --logger "trx;LogFileName=phase2-debug.trx"

      - name: Release build
        run: dotnet build Ngr.Launcher.sln -c Release --no-restore
